function bindForensicCase(t){

 const r=$('#caseRange');if(r)r.oninput=e=>{u.value=Number(e.target.value);update()};
 $('#caseMinus')?.addEventListener('click',()=>{u.value=Math.max(0,u.value-1);update()});
 $('#casePlus')?.addEventListener('click',()=>{u.value=Math.min(15,u.value+1);update()});
 $$('[data-casecheck]').forEach(b=>b.onclick=()=>{caseSeen(b.dataset.casecheck);update()});
 $$('[data-casestamp]').forEach(b=>b.onclick=()=>{u.check=b.dataset.casestamp;update()});
 $$('[data-caseroute]').forEach(b=>b.onclick=()=>{u.check=b.dataset.caseroute;update()});
 $$('[data-case-mask]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.caseMask);if(!u.marks.includes(n))u.marks.push(n);update()});
 $('#caseReveal')?.addEventListener('click',()=>{u.opened=true;update()});
 $('#caseCheck')?.addEventListener('change',e=>{u.check=!!e.target.checked});
 $('#caseApply').onclick=()=>{
  let ok=false;
  if(c===0)ok=u.value===2+t.id%7;
  else if(c===1)ok=u.seen.includes('issue')&&u.seen.includes('entry')&&u.check===true;
  else if(c===2)ok=u.marks.length===3;
  else if(c===3)ok=u.value===4+t.id%6;
  else if(c===4)ok=u.seen.includes('rain')&&u.seen.includes('fountain');
  else if(c===5)ok=u.value>=58&&u.value<=78;
  else if(c===6)ok=u.seen.includes('key')&&u.seen.includes('door');
  else if(c===7)ok=u.value===1;
  else if(c===8)ok=u.value===12&&u.seen.includes('tag');
  else if(c===9)ok=Math.abs(u.value-(25+(t.id*7)%51))<6;
  else if(c===10)ok=u.check==='unknown'&&u.seen.includes('repair')&&u.seen.includes('receive');
  else if(c===11)ok=u.check==='right';
  else if(c===12)ok=u.value===2+t.id%8;
  else if(c===13)ok=u.opened;
  else if(c===14)ok=Math.abs(u.value-(66+t.id%10))<=2&&u.seen.includes('finger');
  else if(c===15)ok=u.value===0&&u.seen.includes('listen');
  else if(c===16)ok=u.value===0;
  else ok=u.value===1;
  if(ok)advanceSceneCase(t);else caseFail('자료와 현장 관측이 아직 맞지 않아. 기록을 열어 확인하고 다시 조사해.');
 };
}

function makeSecretArc(cfg){
 const key='hidden_arc_'+cfg.id+'_v2';
 let st={stage:0,view:'',marks:{},branch:'',opening:0,found:[],ending:''};
 try{let x=JSON.parse(localStorage.getItem(key)||'null');if(x&&Number.isInteger(x.stage))st={...st,...x,marks:x.marks||{},found:x.found||[]}}catch(e){}
 let portal=null,flash='';
 function saveArc(){try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}}
 function soundArc(){try{cfg.sound?.()}catch(e){}}
 function addFlag(flag){st.marks[flag]=true;saveArc();mount()}
 function progress(next,notice){if(next>st.stage){st.stage=next;st.view='';saveArc();flash=notice||'다른 장소의 기록이 바뀌었다.';soundArc();try{cfg.changed?.(notice,st)}catch(e){}mount();}else{flash=notice||''}repaint()}
 function open(){close();portal=document.createElement('div');portal.id='secretHost';portal.className='open';document.body.append(portal);repaint();soundArc()}
 function close(){if(portal){portal.remove();portal=null}flash=''}
 function isEndReady(){return cfg.totalDone()>=300&&st.stage>=5}
 function finish(branch){if(!isEndReady())return;st.branch=branch;st.ending=cfg.endingTitle(branch);saveArc();repaint();try{cfg.changed?.('보이지 않던 마지막 기록이 열렸다.',st)}catch(e){}}
 function repaint(){if(!portal)return;const expected=st.stage===0?cfg.start:cfg.stages[Math.min(st.stage-1,cfg.stages.length-1)];
 let page=st.stage>0&&st.stage<5&&cfg.zone()!==expected?`<div class="secretArtifact"><div class="secretTag">NEW SIGNAL · 장소 변동</div><div class="secretEndArt">📡</div><p>${flash||'다른 장소의 기록이 바뀌었다.'}</p></div><div class="secretActions"><button data-arc-act="secret-travel" data-arc-val="${expected}">${cfg.location(expected)}에서 확인하기</button></div>`:cfg.draw({st,zone:cfg.zone(),total:cfg.totalDone(),ready:isEndReady(),setView:v=>{st.view=v;saveArc()},flash});
 portal.innerHTML=`<section class="secretWindow" data-arc="${cfg.id}" role="dialog" aria-modal="true" aria-label="${cfg.label}"><div class="secretHeader"><div><strong>${cfg.label}</strong><small>${cfg.kicker}</small></div><button class="secretClose" data-arc-close="1" aria-label="닫기">×</button></div><div class="secretBody">${page}${flash?`<div class="secretMessage">${flash}</div>`:''}</div></section>`;
 portal.onclick=e=>{if(e.target===portal||e.target.closest('[data-arc-close]')){close();return}const btn=e.target.closest('[data-arc-act]');if(!btn)return;const act=btn.dataset.arcAct,val=btn.dataset.arcVal||'';flash='';if(act==='secret-travel'){close();cfg.move(+val);return}try{cfg.act({act,val,st,zone:cfg.zone(),progress,addFlag,open,close,repaint,finish,ready:isEndReady(),flash:t=>flash=t})}catch(ex){flash='장치 상태를 다시 확인해.';console.error('side investigation error',ex);repaint()}};
 }
 function mount(){const target=cfg.surface();if(!target)return;if(getComputedStyle(target).position==='static')target.style.position='relative';
 let old=target.querySelector('.secretBeacon');old?.remove();target.querySelector('.secretBeat')?.remove();target.querySelector('.secretEffectVisual')?.remove();
 const zone=cfg.zone();const discoverable=st.stage===0?zone===cfg.start:zone===cfg.stages[Math.min(st.stage-1,cfg.stages.length-1)];
 if(discoverable||st.stage>=5){const b=document.createElement('button');b.type='button';b.className='secretBeacon '+(st.stage>=5?'quiet':'');b.setAttribute('aria-label',cfg.buttonText(st,zone));b.innerHTML=cfg.buttonText(st,zone)+(st.stage>=5?'<small>회수된 기록</small>':'');b.onclick=e=>{e.stopPropagation();open()};target.append(b)}
 if(st.stage>0&&typeof cfg.visual==='function'){const art=document.createElement('div');art.className='secretEffectVisual';art.innerHTML=cfg.visual(st,zone)||'';target.append(art)}
 if(st.stage>0){const band=document.createElement('div');band.className='secretBeat';band.textContent=cfg.worldChange(st);target.append(band)}
 }
 function attach(){const orig=cfg.render();if(orig){cfg.hook(orig,()=>{mount()})}mount()}
 return {st,open,close,repaint,mount,attach,progress,addFlag,finish,isEndReady,saveArc};
}

 if(s.ending)return `<div class="secretDarkScene"><div class="secretSilhouettes"><span></span>${s.branch==='open'?'':'<span></span>'}</div></div><h2>${s.ending}</h2><p>${s.branch==='open'?'가면을 벗자 사라졌던 주최자는 문 뒤에 갇혀 있었다. 춤을 추던 사람은 자신이 주최자라고 믿도록 기록이 바뀐 하객이었다.':'마지막 초대장을 봉인하자 대연회장의 모든 가면이 같은 얼굴로 변했다. 아무도 사라지지 않았다는 기록만 남았다.'}</p>`;
 if(s.stage===0)return `<div class="secretDarkScene"><div class="secretSilhouettes"><span></span><span></span>${s.marks.dark?'<span class="secretGlitch"></span>':''}</div><p style="position:absolute;bottom:4px;left:12px;color:#e7d0ad;font-size:12px">${s.marks.dark?'거울 속 그림자는 세 사람이다. 실제 무대에는 둘뿐.':'무도회가 멈춘 순간에도 두 사람은 춤을 추고 있다.'}</p></div><div class="secretActions"><button data-arc-act="egg" class="soft" style="font-size:10px;opacity:.3">✧</button><button data-arc-act="light">${s.marks.dark?'샹들리에 다시 켜기':'샹들리에 소등하기'}</button>${s.marks.dark?'<button data-arc-act="trace">세 번째 그림자 윤곽 촬영</button>':''}</div>`;
 if(s.stage===1)return `<h3>주최자의 초대장</h3><div class="secretArtifact" style="background:radial-gradient(circle,#75665b,#231f2e);text-align:center"><div style="margin:auto;width:75%;min-height:165px;background:#e6d3ab;border:2px solid #a88352;border-radius:8px;transform:rotate(${s.marks.fold?'-4':'3'}deg);padding:18px;color:#57393b;font-family:serif"><div>THE LAST INVITATION</div><div style="font-size:52px;margin:12px">✉</div>${s.marks.fold?'<div style="font-size:12px;font-weight:bold">수신인과 발신인의 서명이 같다</div>':'<div style="font-size:12px">봉투의 접힌 모서리에 먹물이 비친다</div>'}</div></div><div class="secretActions"><button data-arc-act="fold">봉투의 접힌 면 뒤집기</button>${s.marks.fold?'<button data-arc-act="record">서명 아래 눌린 글씨 채취</button>':''}</div>`;
 if(s.stage===2)return `<h3>겨울 정원의 성에 낀 유리</h3><div id="maskFog" class="secretArtifact" style="min-height:260px;touch-action:none;display:grid;place-items:center;background:linear-gradient(110deg,#738e9b,#1b3e51);user-select:none"><div style="text-align:center;font-size:49px;opacity:${.2+Math.min(1,(s.marks.rub||0)/8)*.8}">🚪</div><div style="position:absolute;inset:0;background:#d5edf2;opacity:${Math.max(0,.87-(s.marks.rub||0)*.12)};pointer-events:none;transition:opacity .12s"></div><div style="position:absolute;bottom:11px;left:12px;font-size:11px;color:#eaf9ff">유리 위를 손가락으로 여러 번 문질러</div></div>${(s.marks.rub||0)>=7?'<div class="secretActions"><button data-arc-act="photograph">유리 뒤쪽 출입 흔적 촬영</button></div>':'<div class="secretHint">물기 아래에 무언가 있다. 스마트폰에서는 손가락으로 움직여 봐.</div>'}`;
 if(s.stage===3)return `<h3>공방에서 대여하지 않았다는 가면</h3><div class="secretArtifact" style="text-align:center;background:linear-gradient(140deg,#42253e,#1b1527)"><button data-arc-act="flip" style="border:0;background:none;color:#fff;font-size:86px;cursor:pointer;min-height:125px">${s.marks.flipped?'🎭':'🎭'}</button><p style="color:#e9ceaf">${s.marks.flipped?'안쪽 봉제선: 주최자의 이니셜이 아니라 무도회 소품 관리 번호가 적혀 있다.':'겉면에는 주최자의 문장이 새겨져 있다. 가면을 들어 뒷면을 조사해.'}</p></div>${s.marks.flipped?'<div class="secretActions"><button data-arc-act="stitch">봉제선 아래 숨은 관리표 뜯기</button></div>':''}`;
 if(s.stage===4)return `<h3>비밀 복도의 문</h3><div class="secretDarkScene" style="min-height:245px;text-align:center;padding:20px"><div style="font-size:83px;line-height:1.45">${s.marks.keyed?'🚪':'🔒'}</div><div style="color:#f1d7af;font-size:12px">관리표를 떼자 열쇠 구멍이 다른 방향으로 움직였다.</div></div><div class="secretActions"><button data-arc-act="key">가면 관리표를 열쇠 구멍에 넣기</button>${s.marks.keyed?'<button data-arc-act="door">문 뒤쪽 밀어 보기</button>':''}</div>`;
 return `<div class="secretDarkScene"><div class="secretSilhouettes"><span></span><span></span><span class="secretGlitch"></span></div></div>${s.marks.egg>=3?'<div class="secretTag">EASTER EGG / 무도회 경고문</div>':''}<div class="secretTag">THE UNINVITED · HIDDEN STORY</div><h2>주최자가 사라진 건 초대장이 바뀐 뒤였다</h2><p>비밀문 뒤에는 누구나 주최자가 될 수 있도록 얼굴과 목소리를 맞춘 가면 보관함이 있어. 무도회가 시작되기 전부터 주최자의 이름은 다른 하객에게 붙어 있었던 거야.</p>${ready?'<div class="secretActions"><button data-arc-act="ending" data-arc-val="open">진짜 주최자와 가면의 출처 공개</button><button data-arc-act="ending" data-arc-val="close">초대장을 봉인하고 무도회 계속</button></div>':`<div class="secretHint">숨은 방의 기록은 보존됐어. 정규 사건을 모두 해결하면 다른 마지막 장면이 열린다. (${total}/300)</div>`}`
 },
 act:({act,val,st:s,progress,addFlag,repaint,flash,finish})=>{
 if(act==='egg'){s.marks.egg=(s.marks.egg||0)+1;maskArc.saveArc();if(s.marks.egg>=3)flash('샹들리에 바닥에 새겨진 글씨: “이름을 모르는 손님에게 자리를 내주지 마.”');repaint();return}
 if(act==='light'){s.marks.dark=!s.marks.dark;maskArc.saveArc();repaint();return}
 if(act==='trace'){if(s.marks.dark)progress(1,'거울에 세 번째 사람의 흔적이 남았다. 초대장 보관실의 봉투에 새 지문이 나타났다.');return}
 if(act==='fold'){addFlag('fold');repaint();return}
 if(act==='record'){progress(2,'같은 서명이 서로 다른 필압으로 두 번 쓰여 있다. 정원 유리에서 또 다른 방문 경로가 보인다.');return}
 if(act==='photograph'){if((s.marks.rub||0)>=7)progress(3,'유리 뒤쪽 복도의 발자국이 가면 공방 방향으로 이어진다.');return}
 if(act==='flip'){addFlag('flipped');repaint();return}
 if(act==='stitch'){progress(4,'주최자 가면은 개인 소유물이 아니라 공연 소품이었다. 관리표는 비밀 복도를 가리킨다.');return}
 if(act==='key'){addFlag('keyed');repaint();return}
 if(act==='door'){progress(5,'벽 너머의 두 번째 연회장과 복제된 초대장 보관함을 발견했다.');return}
 if(act==='ending'){finish(val);return}
 }
 });
 // Touch-friendly rubbing via pointer movement, with browser animation left intact.
 let rubbing=false;
 document.addEventListener('pointerdown',e=>{if(e.target.closest('#maskFog')){rubbing=true;rub(e)}});
 document.addEventListener('pointermove',e=>{if(rubbing)rub(e)});
 document.addEventListener('pointerup',()=>{rubbing=false});
 function rub(e){if(maskArc.st.stage!==2)return;maskArc.st.marks.rub=Math.min(8,(maskArc.st.marks.rub||0)+1);maskArc.saveArc();let fog=document.querySelector('#maskFog');if(fog){const cover=fog.querySelector('div[style*="pointer-events:none"]');if(cover)cover.style.opacity=String(Math.max(0,.87-maskArc.st.marks.rub*.12))}if(maskArc.st.marks.rub>=7)maskArc.repaint()}
 maskArc.attach();window.__sideStory_mask=maskArc;
})();

render();if(G.seen.indexOf('intro'+G.chapter)<0){G.seen.push('intro'+G.chapter);persist();setTimeout(()=>playStory(G.chapter,'intro'),200)}
})();
